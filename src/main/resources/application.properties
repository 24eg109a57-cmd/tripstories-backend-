spring.application.name=tripstories-backend

server.port=${PORT:8080}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# JWT_SECRET must be set as an environment variable (no fallback in production)
app.jwt.secret=${JWT_SECRET}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Default datasource (local dev). Overridden entirely by application-aiven.properties in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tripstories?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

# DB_PASSWORD has no hardcoded fallback — must be set via environment variable
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB